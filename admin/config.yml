backend:
  name: github
  repo: MUSE08/personal-site
  branch: main
  base_url: https://ali8muse.dpdns.org
  auth_endpoint: /api/auth
  site_domain: ali8muse.dpdns.org

site_url: https://ali8muse.dpdns.org
logo:
  src: https://ali8muse.dpdns.org/assets/logo.svg
  show_in_header: true
app_title: علی واهب

media_folder: assets/uploads
public_folder: /assets/uploads

collections:
  - name: projects
    label: پروژه‌ها
    label_singular: پروژه
    description: مأموریت‌ها و پروژه‌ها
    folder: content/projects
    format: json
    create: true
    identifier_field: name
    summary: "{{name}} · {{lang}}"
    fields:
      - { label: نام پروژه, name: name, widget: string }
      - { label: زبان/تکنولوژی, name: lang, widget: string }
      - { label: عنوان فارسی, name: title_fa, widget: string }
      - { label: عنوان انگلیسی, name: title_en, widget: string }
      - { label: توضیحات فارسی, name: desc_fa, widget: text }
      - { label: توضیحات انگلیسی, name: desc_en, widget: text }
      - { label: تگ‌ها, name: tags, widget: list, field: { label: تگ, name: tag, widget: string } }
      - { label: لینک دمو (اختیاری), name: link, widget: string, required: false }
      - { label: لینک‌های بیشتر (اختیاری), name: links, widget: list, required: false, collapsed: true, fields: [{ label: برچسب, name: label, widget: string }, { label: آدرس, name: url, widget: string }] }

  - name: blog
    label: بلاگ
    label_singular: پست
    description: قاب‌هایی از فکر، کتاب و فیلم
    folder: content/blog
    format: json
    create: true
    identifier_field: title_en
    summary: "{{tag}} · {{title_fa}}"
    fields:
      - { label: تگ, name: tag, widget: select, options: [book, film, thought], default: thought }
      - { label: تاریخ, name: date, widget: string, default: "۱۴۰۵" }
      - { label: عنوان فارسی, name: title_fa, widget: string }
      - { label: عنوان انگلیسی, name: title_en, widget: string }
      - { label: خلاصه فارسی, name: excerpt_fa, widget: text }
      - { label: خلاصه انگلیسی, name: excerpt_en, widget: text }
      - { label: لینک (اختیاری), name: link, widget: string, required: false }
      - { label: متن کامل (اختیاری), name: body, widget: markdown, required: false }

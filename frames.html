<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title>Ali Vaheb | Frames — آرشیو بلاگ</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='64' y2='64'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23c084fc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='19' r='12' fill='none' stroke='url(%23g)' stroke-width='6'/%3E%3Ccircle cx='32' cy='45' r='12' fill='none' stroke='url(%23g)' stroke-width='6'/%3E%3Cpath d='M20 32H44' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <header class="header scrolled" id="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo mono">
                <span class="nav__logo-mark">
                    <svg viewBox="0 0 64 64" width="26" height="26" fill="none">
                        <circle cx="32" cy="19" r="12" stroke="#22d3ee" stroke-width="7"/>
                        <circle cx="32" cy="45" r="12" stroke="#c084fc" stroke-width="7"/>
                        <path d="M20 32 H44" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
                    </svg>
                </span>
                <span>Ali Vaheb</span>
            </a>
            <div class="nav__actions">
                <button class="lang-toggle mono" id="lang-toggle" aria-label="تغییر زبان">EN</button>
            </div>
        </nav>
    </header>

    <main class="archive">
        <a href="index.html" class="archive__back mono">← ../</a>
        <div class="archive__head">
            <span class="archive__tag mono">[SC.04]</span>
            <h1 class="archive__title">./<span class="accent">frames</span> <span class="accent" style="opacity:.5">— archive</span></h1>
            <p class="archive__sub mono" id="archive-sub">آرشیو همهٔ نوشته‌ها</p>
        </div>
        <p class="archive__count mono" id="archive-count"></p>
        <div class="container">
            <div class="frames" id="blog-frames"></div>
        </div>
    </main>

    <footer class="footer mono">
        <span>© ۱۴۰۴ علی واهب</span>
        <span class="footer__mid">35mm · void · mind</span>
    </footer>

    <script>
        (function () {
            const wrap = document.getElementById('blog-frames');
            const count = document.getElementById('archive-count');
            const sub = document.getElementById('archive-sub');
            const btn = document.getElementById('lang-toggle');
            const root = document.documentElement;
            let lang = root.getAttribute('lang') === 'en' ? 'en' : 'fa';

            const dict = {
                'archive-sub': { fa: 'آرشیو همهٔ نوشته‌ها', en: 'Archive of all notes' },
                count: { fa: 'frame(s)', en: 'frame(s)' },
                read: { fa: 'بخوان', en: 'read' }
            };

            function applyLang() {
                root.setAttribute('lang', lang);
                root.setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
                btn.textContent = lang === 'fa' ? 'EN' : 'FA';
                if (sub) sub.textContent = dict['archive-sub'][lang];
                try { localStorage.setItem('lang', lang); } catch (e) {}
                render();
            }
            btn.addEventListener('click', () => { lang = lang === 'fa' ? 'en' : 'fa'; applyLang(); });

            let posts = [];
            function render() {
                const tagMap = {
                    frame: { fa: 'یک نما', en: 'A Shot', desc: { fa: 'یک قاب، یک نظر — آخرین فیلم/سریال که تماشا کردم', en: 'A frame, a take — the last film/series I watched' } },
                    page: { fa: 'یک برگ', en: 'A Page', desc: { fa: 'از کتاب‌ها و ایده‌هایی که برگه‌ای از ذهنم را پر کردند', en: 'From books and ideas that filled a page of my mind' } },
                    word: { fa: 'یک واژه', en: 'A Word', desc: { fa: 'شعرها و یادداشت‌هایی که بهانه‌ای شدند برای نوشتن', en: 'Poems and notes that became a reason to write' } },
                    sound: { fa: 'یک آوا', en: 'A Sound', desc: { fa: 'موسیقی یا پادکستی که این روزها درگیرم کرده', en: 'Music or a podcast that\'s been on my mind lately' } }
                };
                function tagLabel(t) { return tagMap[t] ? tagMap[t][lang] : t; }
                function tagDesc(t) { return tagMap[t] ? (tagMap[t].desc[lang] || tagMap[t].desc.fa || tagMap[t].desc.en) : ''; }
                if (!posts.length) { wrap.innerHTML = '<p class="mono" style="color:var(--text-muted)">&gt; هیچ نوشته‌ای ثبت نشده...</p>'; return; }

                const byTag = {};
                posts.forEach(p => { const t = p.tag || 'frame'; (byTag[t] = byTag[t] || []).push(p); });
                const cats = ['frame', 'page', 'word', 'sound'];

                const html = cats.map(tag => {
                    const list = byTag[tag] || [];
                    const count = lang === 'en' ? list.length + ' post(s)' : list.length + ' پست';
                    const items = list.map(p => {
                        const img = p.image ? `<img class="frame-item__img" src="${p.image}" alt="" loading="lazy">` : '';
                        const title = p['title_' + lang] || p.title_fa || p.title_en || '';
                        const body = p.body ? `<div class="frame-item__text">${p.body.replace(/\n/g, '<br>')}</div>` : '';
                        return `<div class="frame-item">
                            ${img}
                            <div class="frame-item__content">
                                <span class="frame-item__date mono">${p.date || ''}</span>
                                <h4 class="frame-item__title">${title}</h4>
                                ${body}
                            </div>
                        </div>`;
                    }).join('');
                    return `<article class="frame-post frame-cat" data-tag="${tag}" tabindex="0">
                        <div class="frame-post__meta mono">
                            <span class="frame-post__date">${count}</span>
                        </div>
                        <h3 class="frame-post__title">${tagLabel(tag)}</h3>
                        <p class="frame-post__excerpt">${tagDesc(tag)}</p>
                        <div class="frame-cat__items" hidden>
                            ${items || '<p class="mono" style="color:var(--text-muted);padding:8px">&gt; هیچ پستی ثبت نشده...</p>'}
                        </div>
                    </article>`;
                }).join('');

                wrap.innerHTML = html;
                wrap.querySelectorAll('.frame-cat').forEach(card => {
                    const items = card.querySelector('.frame-cat__items');
                    card.addEventListener('click', function(e) {
                        if (e.target.closest('a')) return;
                        const isOpen = !items.hidden;
                        items.hidden = isOpen;
                        card.classList.toggle('frame-post--open', !isOpen);
                    });
                });
                if (count) count.textContent = `~/frames > ${posts.length} ${dict.count[lang]}`;
            }

            const saved = (() => { try { return localStorage.getItem('lang'); } catch (e) { return null; } })();
            if (saved) lang = saved;
            applyLang();

            fetch('data/blog.json')
                .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(data => { posts = Array.isArray(data.posts) ? data.posts : []; render(); })
                .catch(() => { wrap.innerHTML = ''; });
        })();
    </script>
</body>
</html>

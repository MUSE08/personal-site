<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title>Ali Vaheb | Frames — آرشیو بلاگ</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='64' y2='64'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23c084fc'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='19' r='12' fill='none' stroke='url(%23g)' stroke-width='6'/%3E%3Ccircle cx='32' cy='45' r='12' fill='none' stroke='url(%23g)' stroke-width='6'/%3E%3Cpath d='M20 32H44' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <canvas id="particles"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <header class="header scrolled" id="header">
        <nav class="nav container">
            <a href="index.html" class="nav__logo mono">
                <span class="nav__logo-mark">
                    <svg viewBox="0 0 64 64" width="26" height="26" fill="none">
                        <circle cx="32" cy="19" r="12" stroke="#22d3ee" stroke-width="7"/>
                        <circle cx="32" cy="45" r="12" stroke="#c084fc" stroke-width="7"/>
                        <path d="M20 32 H44" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
                    </svg>
                </span>
                <span>Ali Vaheb</span>
            </a>
            <ul class="nav__menu" id="nav-menu">
                <li><a href="index.html#home" class="nav__link" data-i18n="nav-home">خانه</a></li>
                <li><a href="index.html#about" class="nav__link" data-i18n="nav-about">درباره</a></li>
                <li><a href="index.html#skills" class="nav__link" data-i18n="nav-skills">مهارت‌ها</a></li>
                <li><a href="works.html" class="nav__link" data-i18n="nav-projects">پروژه‌ها</a></li>
                <li><a href="frames.html" class="nav__link active" data-i18n="nav-blog">بلاگ</a></li>
                <li><a href="index.html#signal" class="nav__link" data-i18n="nav-signal">سیگنال</a></li>
                <li><a href="index.html#contact" class="nav__link" data-i18n="nav-contact">تماس</a></li>
            </ul>
            <div class="nav__actions">
                <button class="lang-toggle mono" id="lang-toggle" aria-label="تغییر زبان">EN</button>
                <div class="nav__toggle" id="nav-toggle"><span></span><span></span><span></span></div>
            </div>
        </nav>
    </header>

    <main class="archive">
        <a href="index.html" class="archive__back mono">← ../</a>
        <div class="archive__head">
            <span class="archive__tag mono">[SC.04]</span>
            <h1 class="archive__title">./<span class="accent" id="archive-title">frames</span> <span class="accent" style="opacity:.5">— archive</span></h1>
            <p class="archive__sub mono" id="archive-sub">آرشیو همهٔ نوشته‌ها</p>
        </div>

        <div class="archive__filters mono" id="archive-filters"></div>
        <p class="archive__count mono" id="archive-count"></p>

        <div class="container">
            <div class="frames" id="blog-frames"></div>
        </div>
    </main>

    <footer class="footer mono">
        <span>© ۱۴۰۴ علی واهب</span>
        <span class="footer__mid">35mm · void · mind</span>
    </footer>

    <script>
        (function () {
            const wrap = document.getElementById('blog-frames');
            const count = document.getElementById('archive-count');
            const sub = document.getElementById('archive-sub');
            const titleEl = document.getElementById('archive-title');
            const filters = document.getElementById('archive-filters');
            const btn = document.getElementById('lang-toggle');
            const root = document.documentElement;
            let lang = root.getAttribute('lang') === 'en' ? 'en' : 'fa';
            let activeTag = new URLSearchParams(location.search).get('tag') || '';

            const navDict = {
                'nav-home': { fa: 'خانه', en: 'Home' },
                'nav-about': { fa: 'درباره', en: 'About' },
                'nav-skills': { fa: 'مهارت‌ها', en: 'Stack' },
                'nav-projects': { fa: 'پروژه‌ها', en: 'Works' },
                'nav-blog': { fa: 'بلاگ', en: 'Blog' },
                'nav-signal': { fa: 'سیگنال', en: 'Signal' },
                'nav-contact': { fa: 'تماس', en: 'Contact' }
            };

            const tagMap = {
                frame: { fa: 'یک نما', en: 'A Shot', desc: { fa: 'یک قاب، یک نظر — آخرین فیلم/سریال که تماشا کردم', en: 'A frame, a take — the last film/series I watched' } },
                page: { fa: 'یک برگ', en: 'A Page', desc: { fa: 'از کتاب‌ها و ایده‌هایی که برگه‌ای از ذهنم را پر کردند', en: 'From books and ideas that filled a page of my mind' } },
                word: { fa: 'یک واژه', en: 'A Word', desc: { fa: 'شعرها و یادداشت‌هایی که بهانه‌ای شدند برای نوشتن', en: 'Poems and notes that became a reason to write' } },
                sound: { fa: 'یک آوا', en: 'A Sound', desc: { fa: 'موسیقی یا پادکستی که این روزها درگیرم کرده', en: 'Music or a podcast that\'s been on my mind lately' } }
            };
            function tagLabel(t) { return tagMap[t] ? tagMap[t][lang] : t; }

            const dict = {
                all: { fa: 'همه', en: 'All' },
                empty: { fa: 'هیچ پستی در این بخش نیست', en: 'No posts in this section' }
            };

            let posts = [];

            function renderFilters() {
                const cats = ['', 'frame', 'page', 'word', 'sound'];
                filters.innerHTML = cats.map(t => {
                    const label = t ? tagLabel(t) : dict.all[lang];
                    const cls = activeTag === t ? 'active' : '';
                    return `<a class="archive__filter ${cls}" data-tag="${t}" href="frames.html${t ? '?tag=' + t : ''}">${label}</a>`;
                }).join('');
                filters.querySelectorAll('.archive__filter').forEach(a => {
                    a.addEventListener('click', function (e) {
                        e.preventDefault();
                        activeTag = a.getAttribute('data-tag');
                        history.replaceState(null, '', a.getAttribute('href'));
                        renderFilters();
                        render();
                    });
                });
            }

            function render() {
                const tagMapActive = tagMap[activeTag];
                titleEl.textContent = activeTag && tagMapActive ? tagMapActive[lang] : 'frames';
                sub.textContent = activeTag && tagMapActive
                    ? (tagMapActive.desc[lang] || tagMapActive.desc.fa)
                    : (lang === 'en' ? 'All posts' : 'همهٔ نوشته‌ها');

                const filtered = activeTag ? posts.filter(p => (p.tag || 'frame') === activeTag) : posts.slice();
                filtered.sort((a, b) => String(b.date || '').localeCompare(String(a.date || ''), 'fa'));

                if (!filtered.length) {
                    wrap.innerHTML = `<p class="mono" style="color:var(--text-muted);padding:12px 0">&gt; ${dict.empty[lang]}</p>`;
                    if (count) count.textContent = '';
                    return;
                }

                const html = filtered.map(p => {
                    const img = p.image ? `<img class="frame-item__img" src="${p.image}" alt="" loading="lazy">` : '';
                    const title = p['title_' + lang] || p.title_fa || p.title_en || '';
                    const body = p.body ? `<div class="frame-item__text">${p.body.replace(/\n/g, '<br>')}</div>` : '';
                    return `<article class="frame-item">
                        ${img}
                        <div class="frame-item__content">
                            <span class="frame-item__date mono">${tagLabel(p.tag)} · ${p.date || ''}</span>
                            <h4 class="frame-item__title">${title}</h4>
                            ${body}
                        </div>
                    </article>`;
                }).join('');

                wrap.innerHTML = html;
                if (count) count.textContent = `~/frames > ${filtered.length} ${lang === 'en' ? 'post(s)' : 'پست'}`;
            }

            function applyNav() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (navDict[key] && navDict[key][lang]) el.textContent = navDict[key][lang];
                });
            }

            const navToggle = document.getElementById('nav-toggle');
            const navMenu = document.getElementById('nav-menu');
            navToggle?.addEventListener('click', () => { navMenu?.classList.toggle('open'); navToggle.classList.toggle('open'); });
            document.querySelectorAll('.nav__link').forEach(l => l.addEventListener('click', () => { navMenu?.classList.remove('open'); navToggle?.classList.remove('open'); }));

            function applyLang() {
                root.setAttribute('lang', lang);
                root.setAttribute('dir', lang === 'fa' ? 'rtl' : 'ltr');
                btn.textContent = lang === 'fa' ? 'EN' : 'FA';
                try { localStorage.setItem('lang', lang); } catch (e) {}
                applyNav();
                renderFilters();
                render();
            }
            btn.addEventListener('click', () => { lang = lang === 'fa' ? 'en' : 'fa'; applyLang(); });

            const saved = (() => { try { return localStorage.getItem('lang'); } catch (e) { return null; } })();
            if (saved) lang = saved;
            applyLang();

            fetch('data/blog.json')
                .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(data => { posts = Array.isArray(data.posts) ? data.posts : []; render(); })
                .catch(() => { wrap.innerHTML = ''; });
        })();
    </script>
</body>
</html>
